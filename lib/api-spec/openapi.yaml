openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DataVerse data product catalog API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dataProducts
    description: Data product catalog operations
  - name: favourites
    description: Favourited data products
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog/summary:
    get:
      operationId: getCatalogSummary
      tags: [dataProducts]
      summary: Catalog summary counts
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSummary"
  /data-products:
    get:
      operationId: listDataProducts
      tags: [dataProducts]
      summary: List data products
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: domain
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Data products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataProduct"
  /data-products/{id}:
    get:
      operationId: getDataProduct
      tags: [dataProducts]
      summary: Get a data product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Data product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataProduct"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /data-products/{id}/status:
    patch:
      operationId: updateDataProductStatus
      tags: [dataProducts]
      summary: Publish or unpublish a data product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataProductStatusUpdate"
      responses:
        "200":
          description: Updated data product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataProduct"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /data-products/{id}/glossary:
    get:
      operationId: getGlossaryFields
      tags: [dataProducts]
      summary: Glossary fields of a data product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Glossary fields
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GlossaryField"
  /data-products/{id}/sample-data:
    get:
      operationId: getSampleData
      tags: [dataProducts]
      summary: Sample data rows of a data product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sample data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleData"
  /data-products/{id}/runs:
    get:
      operationId: listRuns
      tags: [dataProducts]
      summary: Run history of a data product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductRun"
    post:
      operationId: triggerRun
      tags: [dataProducts]
      summary: Trigger a run now
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: The created run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /data-products/{id}/consumers:
    get:
      operationId: listConsumers
      tags: [dataProducts]
      summary: Consumers of a data product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Consumers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Consumer"
  /data-products/{id}/subscription-plans:
    get:
      operationId: listSubscriptionPlans
      tags: [dataProducts]
      summary: Subscription plans of a data product, with active subscription info
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Subscription plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPlan"
  /subscription-plans/{planId}/subscribe:
    post:
      operationId: subscribeToPlan
      tags: [dataProducts]
      summary: Subscribe to a plan, or renew an existing subscription
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The plan with its updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlan"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /favourites:
    get:
      operationId: listFavourites
      tags: [favourites]
      summary: List favourited data product ids
      responses:
        "200":
          description: Favourited data product ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavouritesList"
  /favourites/sync:
    post:
      operationId: syncFavourites
      tags: [favourites]
      summary: Merge a set of data product ids into favourites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavouritesSyncRequest"
      responses:
        "200":
          description: Merged favourites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavouritesList"
  /favourites/{productId}:
    put:
      operationId: addFavourite
      tags: [favourites]
      summary: Add a data product to favourites
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated favourites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavouritesList"
        "404":
          description: Data product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: removeFavourite
      tags: [favourites]
      summary: Remove a data product from favourites
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated favourites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavouritesList"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    FavouritesList:
      type: object
      required: [productIds]
      properties:
        productIds:
          type: array
          items: { type: integer }
    FavouritesSyncRequest:
      type: object
      required: [productIds]
      properties:
        productIds:
          type: array
          items: { type: integer }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiMessage:
      type: object
      required: [error]
      properties:
        error: { type: string }
    CatalogSummary:
      type: object
      required: [totalProducts, publishedCount, draftCount, domains, healthyCount, failedCount]
      properties:
        totalProducts: { type: integer }
        publishedCount: { type: integer }
        draftCount: { type: integer }
        healthyCount: { type: integer }
        failedCount: { type: integer }
        domains:
          type: array
          items:
            type: object
            required: [domain, count]
            properties:
              domain: { type: string }
              count: { type: integer }
    DataProduct:
      type: object
      required:
        - id
        - name
        - urn
        - description
        - domain
        - owner
        - status
        - version
        - schedule
        - tags
        - createdAt
        - updatedAt
      properties:
        id: { type: integer }
        name: { type: string }
        urn: { type: string }
        description: { type: string }
        domain: { type: string }
        owner: { type: string }
        status:
          type: string
          enum: [published, draft]
        version: { type: string }
        schedule: { type: string }
        project: { type: ["string", "null"] }
        sourceAlignment: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        latestRun:
          oneOf:
            - $ref: "#/components/schemas/ProductRun"
            - type: "null"
        createdAt: { type: string }
        updatedAt: { type: string }
    DataProductStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [published, draft]
    GlossaryField:
      type: object
      required: [id, fieldName, mandatory, dataType, sourceTable, sourceColumn]
      properties:
        id: { type: integer }
        fieldName: { type: string }
        mandatory: { type: boolean }
        dataType: { type: string }
        sourceTable: { type: string }
        sourceColumn: { type: string }
        description: { type: ["string", "null"] }
    SampleData:
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: { type: string }
    ProductRun:
      type: object
      required: [id, dataProductId, status, startedAt]
      properties:
        id: { type: integer }
        dataProductId: { type: integer }
        status:
          type: string
          enum: [running, success, failed]
        message: { type: ["string", "null"] }
        startedAt: { type: string }
        endedAt: { type: ["string", "null"] }
        durationSeconds: { type: ["integer", "null"] }
        rowsProcessed: { type: ["integer", "null"] }
    PlanSubscription:
      type: object
      required: [id, subscribedAt, expiresAt, autoRenew]
      properties:
        id: { type: integer }
        subscribedAt: { type: string }
        expiresAt: { type: string }
        autoRenew: { type: boolean }
    SubscriptionPlan:
      type: object
      required:
        - id
        - dataProductId
        - name
        - channel
        - price
        - validityMonths
        - type
        - callLimit
      properties:
        id: { type: integer }
        dataProductId: { type: integer }
        name: { type: string }
        channel:
          type: string
          enum: [Data Product, Postgres, REST-API]
        price: { type: string }
        validityMonths: { type: integer }
        type:
          type: string
          enum: [Recurring Subscription, One-time Subscription]
        frequency: { type: ["string", "null"] }
        callLimit: { type: integer }
        subscription:
          oneOf:
            - $ref: "#/components/schemas/PlanSubscription"
            - type: "null"
    Consumer:
      type: object
      required: [id, name, type, channel, lastAccessAt]
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string }
        channel: { type: string }
        lastAccessAt: { type: string }
